name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The project caps Python below 3.11, so 3.10 is the newest version
    # the matrix can use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        # uwsgi 2.0.21 builds from source and predates GCC 14, where the
        # K&R-style signal handlers are hard errors; the downgrade flags
        # from the GCC 14 porting guide keep the build working.
        env:
          CFLAGS: -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=return-mismatch -Wno-error=implicit-int
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Test
        run: poetry run pytest
      - name: Pyrefly
        run: poetry run pyrefly check .
